<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="nav">
            <div class="nav-item">logo</div>
            <div class="nav-item">art gallery</div>
            <div class="nav-item">menu</div>
        </div>

        <div class="items">
            <div class="item">
                <div class="item-wrapper">
                    <img src="https://images.unsplash.com/flagged/photo-1572392640988-ba48d1a74457?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=464" alt="Ceiling mural art">

                    <div class="img-overlay"></div>
                    <div class="item-copy">
                        <div class="item-name">
                            Ceiling mural art<span>Michael</span>
                        </div>
                        <div class="id">1</div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="item">
                <div class="item-wrapper">
                    <img src="https://images.unsplash.com/photo-1579783901586-d88db74b4fe4?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fGFydCUyMHdhbGxwYXBlcnxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&q=60&w=500" alt="Elegant floral display">

                    <div class="img-overlay"></div>
                    <div class="item-copy">
                        <div class="item-name">
                            Elegant floral display<span>Willem</span>
                        </div>
                        <div class="id">2</div>
                    </div>
                </div>
            </div>
            <div class="divider"></div>
            <div class="item">
                <div class="item-wrapper">
                    <img src="https://images.unsplash.com/photo-1577083165633-14ebcdb0f658?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=388" alt="Floral-textured design">

                    <div class="img-overlay"></div>
                    <div class="item-copy">
                        <div class="item-name">
                            Floral-textured design <span>Jasmine</span>
                        </div>
                        <div class="id">3</div>
                    </div>
                </div>
            </div>
            <div class="divider"></div>
            <div class="item">
                <div class="item-wrapper">
                    <img src="https://images.unsplash.com/photo-1529154166925-574a0236a4f4?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=774" alt="Equestrian statue scene">

                    <div class="img-overlay"></div>
                    <div class="item-copy">
                        <div class="item-name">
                            Horse statue scene<span>Chris</span>
                        </div>
                        <div class="id">4</div>

                    </div>
                </div>
            </div>



        </div>
    </div>


</body>
</html>
